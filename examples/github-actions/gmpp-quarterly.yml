# Example only. This file is not deployed. A GitHub runner cannot write
# straight to your Mac. See the Word guide for Dropbox or OneDrive options.
name: GMPP quarterly check

on:
  schedule:
    # 07:00 UTC on the first day of January, April, July and October.
    - cron: '0 7 1 1,4,7,10 *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -r requirements.txt
      - name: Dry-run detect
        run: python gmpp_pipeline.py --dry-run --no-upload
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmpp-pipeline-logs
          path: |
            logs/
            state/
